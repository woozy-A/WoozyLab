<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoozyLab</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #007aff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #d8e5ff;
      --soft: #eef5ff;
      --shadow: rgba(0, 122, 255, 0.14);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --bg: #101318;
        --card: #1c1f24;
        --border: #27364d;
        --soft: #162131;
        --shadow: rgba(0, 122, 255, 0.22);
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(0, 122, 255, 0.16), transparent 34rem),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 64px 20px;
    }
    header {
      margin-bottom: 28px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .intro {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 34px;
    }
    .app-card {
      display: flex;
      min-height: 220px;
      flex-direction: column;
      justify-content: space-between;
      padding: 26px;
      color: inherit;
      text-decoration: none;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 44px var(--shadow);
      transition: transform 160ms ease, border-color 160ms ease;
    }
    .app-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .app-top {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      width: 74px;
      height: 74px;
      border-radius: 18px;
      box-shadow: 0 12px 28px var(--shadow);
    }
    .glass-logo {
      display: grid;
      width: 74px;
      height: 74px;
      place-items: center;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #9ce7ff, #7a8cff 48%, #c48dff);
      border: 1px solid rgba(255, 255, 255, 0.48);
      border-radius: 18px;
      box-shadow: 0 12px 28px var(--shadow);
    }
    h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .tag {
      display: inline-flex;
      width: fit-content;
      margin-top: 10px;
      padding: 5px 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      background: var(--soft);
      border-radius: 999px;
    }
    .description {
      margin: 24px 0 0;
      color: var(--muted);
    }
    footer {
      margin-top: 34px;
      color: var(--muted);
      font-size: 14px;
    }
    a.inline {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 720px) {
      main {
        padding: 42px 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .app-card {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">WoozyLab</p>
      <h1>귀찮음을 줄이는<br>작은 시스템.</h1>
      <p class="intro">모든 귀찮음은 효율적인 시스템을 만드는 원동력이 됩니다. WoozyLab은 사진 정리, 화면 번역, 작업 자동화 등 일상에서 반복되는 귀찮음을 줄이는 앱을 만듭니다.</p>
    </header>

    <section class="grid" aria-label="WoozyLab apps">
      <a class="app-card" href="./keypic/">
        <div>
          <div class="app-top">
            <img class="logo" src="./assets/keypic-logo.png" alt="KeyPic app icon">
            <div>
              <h2>KeyPic</h2>
              <span class="tag">출시 준비 중</span>
            </div>
          </div>
          <p class="description">키보드 단축키로 많은 사진을 빠르게 검수하고 폴더별로 정리하는 macOS 앱입니다.</p>
        </div>
      </a>

      <a class="app-card" href="./glasslingo/">
        <div>
          <div class="app-top">
            <img class="logo" src="./assets/glasslingo-icon.png" alt="GlassLingo app icon">
            <div>
              <h2>GlassLingo</h2>
              <span class="tag">macOS</span>
            </div>
          </div>
          <p class="description">화면 위 필요한 부분만 빠르게 이해할 수 있도록 돕는 macOS 번역 도구를 준비하고 있습니다.</p>
        </div>
      </a>
    </section>

    <footer>
      <p>문의: <a class="inline" href="mailto:ycw012@naver.com">ycw012@naver.com</a></p>
    </footer>
  </main>
</body>
</html>
