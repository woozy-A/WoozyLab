<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyPic</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #007aff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #d8e5ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --bg: #101318;
        --card: #1c1f24;
        --border: #27364d;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
    }
    .hero {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(0, 122, 255, 0.18);
    }
    h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="hero">
        <img class="logo" src="../assets/keypic-logo.png" alt="KeyPic app icon">
        <h1>KeyPic</h1>
      </div>
      <p>키보드 단축키로 많은 사진을 빠르게 검수하고 폴더별로 정리하는 macOS 앱입니다.</p>
      <p>KeyPic is a macOS photo sorting app for reviewing and organizing images quickly with keyboard shortcuts.</p>
      <nav>
        <a href="./support/">Support</a>
        <a href="./privacy/">Privacy Policy</a>
        <a href="mailto:ycw012@naver.com">Contact</a>
        <a href="../">WoozyLab</a>
      </nav>
    </section>
  </main>
</body>
</html>
