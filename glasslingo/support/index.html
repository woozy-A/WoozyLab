<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlassLingo Support</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #7a8cff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #d8e5ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --bg: #101318;
        --card: #1c1f24;
        --border: #27364d;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
    }
    h1 {
      margin-top: 0;
      letter-spacing: 0;
    }
    p {
      color: var(--muted);
    }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .section {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>GlassLingo Support</h1>
      <p>GlassLingo는 화면 위 필요한 부분만 빠르게 이해할 수 있도록 돕는 macOS 번역 도구입니다. 문의가 있다면 이메일로 연락해 주세요.</p>
      <p>GlassLingo is a macOS translation tool for understanding selected parts of the screen quickly. For questions, please contact us by email.</p>
      <p><a href="mailto:ycw012@naver.com">ycw012@naver.com</a></p>
      <p class="section"><a href="../">Back to GlassLingo</a></p>
    </section>
  </main>
</body>
</html>
