<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support | WoozyLab</title>
  <meta name="description" content="WoozyLab 앱별 고객지원 페이지를 선택할 수 있습니다.">
  <link rel="alternate" hreflang="ko" href="./">
  <link rel="alternate" hreflang="en" href="../en/support/">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="site-page">
  <header class="site-header">
    <nav class="site-nav" aria-label="주요 메뉴">
      <a class="site-brand" href="../">WoozyLab</a>
      <div class="site-nav-links">
        <a href="../#apps">Apps</a>
        <a href="./" aria-current="page">Support</a>
        <a href="../privacy/">Privacy</a>
        <a href="../en/support/" lang="en" hreflang="en">English</a>
      </div>
    </nav>
  </header>

  <main class="page-shell">
    <header class="page-heading">
      <p class="eyebrow">WoozyLab Support</p>
      <h1>어떤 앱을<br>도와드릴까요?</h1>
      <p class="intro">사용 중인 앱을 선택하면 해당 앱의 지원 안내와 문의 방법을 확인할 수 있습니다.</p>
    </header>

    <section aria-labelledby="support-apps-title">
      <div class="section-heading">
        <h2 id="support-apps-title">Apps</h2>
      </div>
      <div class="hub-grid">
        <a class="app-card theme-keypic" href="../keypic/support/">
          <div>
            <div class="app-card-top">
              <img class="app-icon" src="../assets/keypic-logo.png" width="1024" height="1024" alt="KeyPic 앱 아이콘">
              <div>
                <h2>KeyPic</h2>
                <span class="status">Support</span>
              </div>
            </div>
            <p class="description">KeyPic 지원 안내와 문의 방법을 확인합니다.</p>
          </div>
        </a>

        <a class="app-card theme-glasslingo" href="../glasslingo/support/">
          <div>
            <div class="app-card-top">
              <img class="app-icon" src="../assets/glasslingo-icon.png" width="512" height="512" alt="GlassLingo 앱 아이콘">
              <div>
                <h2>GlassLingo</h2>
                <span class="status">Support</span>
              </div>
            </div>
            <p class="description">GlassLingo 지원 안내와 문의 방법을 확인합니다.</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© 2026 WoozyLab</p>
      <nav class="footer-links" aria-label="푸터 메뉴">
        <a href="../">Home</a>
        <a href="../privacy/">Privacy</a>
      </nav>
    </div>
  </footer>
